# Arcanum CI: tests and static checks only. No publish/release jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcanum-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pytest discord.py mcp

      - name: Python unit tests (PYTHONPATH=src)
        shell: bash
        run: python -m pytest tests -q

      - name: Skill registry validation (tolerant)
        shell: bash
        run: |
          if [ -f scripts/validate_skill_registry.py ]; then
            python scripts/validate_skill_registry.py
          elif [ -f skills/registry/registry.json ]; then
            echo "::notice::validator not present in this checkout; checking registry JSON only"
            python -c "import json,pathlib; data=json.loads(pathlib.Path('skills/registry/registry.json').read_text(encoding='utf-8')); assert isinstance(data.get('skills'), list)"
          else
            echo "::notice::registry not present in this checkout; skipping registry validation"
          fi

      - name: Bootstrap manifest validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_dependencies.py
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("config/dependencies.json").read_text(encoding="utf-8"))
          bootstrap = manifest["python"]["bootstrap"]
          assets = bootstrap["assets"]
          expected = {
              "linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64",
              "windows-x64", "windows-arm64",
          }
          assert set(assets) == expected, set(assets)
          assert bootstrap["version"] == "3.12.16", bootstrap["version"]
          for key, spec in assets.items():
              assert spec["url"].startswith("https://"), key
              digest = spec["sha256"]
              assert len(digest) == 64 and all(c in "0123456789abcdef" for c in digest), key
              assert isinstance(spec["size"], int) and spec["size"] > 0, key
              assert spec["python_path"], key
          print("bootstrap manifest OK: six pinned Python assets with SHA-256 and size")
          PY

      - name: Secret scan (grep fallback)
        shell: bash
        run: |
          set -euo pipefail
          # Covers obvious literal secrets in source files. .env.example contains
          # placeholders only, docs are prose, and pinned vendor content is
          # excluded (it is hash-verified by the registry validator).
          # Optional: gitleaks/gitleaks-action@v2.3.6 can be added here when a
          # GITLEAKS_LICENSE secret is configured for the organization.
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}'
          scan_file="${RUNNER_TEMP:-/tmp}/arcanum-secret-scan.txt"
          set +e
          grep -rInE -e "$pattern" \
            --include='*.py' --include='*.sh' --include='*.ps1' \
            --include='*.ts' --include='*.tsx' --include='*.json' \
            --include='*.toml' \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules \
            --exclude-dir=__pycache__ --exclude-dir=vendor \
            . > "$scan_file" 2>/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat "$scan_file"
            echo "::error::Possible secret literal found in source files"
            exit 1
          elif [ "$status" -gt 1 ]; then
            echo "::error::Secret scan could not run (grep error $status)"
            exit 1
          fi
          echo "No obvious secret literals found in scanned source files"

      - name: Bash syntax checks (installers and helpers)
        shell: bash
        run: |
          set -euo pipefail
          # Include the zero-prerequisite bootstrap helpers, not just the entry points.
          for script in installers/install.sh installers/uninstall.sh installers/bootstrap/common.sh; do
            bash -n "$script"
          done
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts integrations -type f -name '*.sh' 2>/dev/null)
          python -m compileall -q src scripts integrations apps/dashboard database tests

      - name: PowerShell parser check (when pwsh is available)
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::notice::pwsh not available; skipping PowerShell parser check"
            exit 0
          fi
          if [ ! -f installers/install.ps1 ]; then
            echo "::notice::installers/install.ps1 not present; skipping parser check"
            exit 0
          fi
          pwsh -NoProfile -Command "\$errors = \$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'installers/install.ps1'), [ref]\$null, [ref]\$errors); if (\$errors.Count -gt 0) { \$errors | ForEach-Object { Write-Error \$_.Message }; exit 1 }"

      - name: PowerShell parser check (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'installers/install.ps1',
            'installers/uninstall.ps1',
            'installers/bootstrap/bootstrap.ps1'
          )
          foreach ($script in $scripts) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $script, $_.Message) }
              exit 1
            }
          }
          Write-Host 'Windows PowerShell 5.1 parser: install.ps1, uninstall.ps1 and bootstrap.ps1 parse cleanly'

      - name: --check write-free verification
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as td:
              home = Path(td) / "arcanum-home"
              result = subprocess.run(
                  [sys.executable, "installers/modules/install_core.py", "install",
                   "--check", "--non-interactive", "--home", str(home)],
                  capture_output=True,
                  text=True,
              )
              print(result.stdout)
              if result.stderr:
                  print(result.stderr, file=sys.stderr)
              # --check never downloads, extracts or creates ARCANUM_HOME.
              assert not home.exists(), f"--check created files under {home}"
              assert "Report: not written" in result.stdout, "--check wrote a report"
              print("--check performed no filesystem writes")
          PY

      - name: Five-skill inventory verification (88 skills)
        shell: bash
        run: |
          python -m pytest tests/installation/test_skill_install_verification.py -q
          python - <<'PY'
          import importlib.util
          import shutil
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          # Python 3.12's dataclasses resolves fields via
          # sys.modules[cls.__module__], so register before exec_module.
          _MODULE_NAME = "install_core_for_ci_five_skill_check"
          spec = importlib.util.spec_from_file_location(
              _MODULE_NAME, root / "installers" / "modules" / "install_core.py"
          )
          core = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[_MODULE_NAME] = core
          spec.loader.exec_module(core)
          with tempfile.TemporaryDirectory() as td:
              home = Path(td) / "home"
              shutil.copytree(root / "skills" / "arcanum", home / "skills" / "arcanum")
              shutil.copytree(
                  root / "skills" / "vendor" / "claude-bughunter",
                  home / "skills" / "vendor" / "claude-bughunter",
              )
              inventory = core.verify_skill_inventory(home, root)
              counts = inventory["counts"]
              assert inventory["ok"], inventory
              assert (counts["arcanum"], counts["vendored"], counts["total"]) == (5, 83, 88)
              print("five Arcanum + 83 vendored = 88 skills; every hash verified")
          PY

      - name: Source checksum manifest (checksums.txt)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          manifest = Path("checksums.txt")
          if not manifest.is_file():
              print("::notice::checksums.txt is not in this checkout; it is generated at release time")
              raise SystemExit(0)
          pattern = re.compile(r"^([0-9a-fA-F]{64})\s+\*?(.+?)\s*$")
          verified = 0
          for line in manifest.read_text(encoding="utf-8").splitlines():
              match = pattern.match(line.strip())
              if not match:
                  continue  # headings and pinned upstream artifact rows are informational
              digest, name = match.group(1).lower(), match.group(2)
              path = Path(name)
              if path.is_file():
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert actual == digest, f"checksum mismatch for {name}"
                  verified += 1
          print(f"checksums.txt: {verified} tracked source digests verified")
          PY

      - name: Database migration test
        shell: bash
        env:
          ARCANUM_HOME: ${{ runner.temp }}/arcanum-ci-home
        run: |
          set -euo pipefail
          if [ -f scripts/migrate_database.py ]; then
            python scripts/migrate_database.py
            python - <<'PY'
          import os
          from pathlib import Path
          home = Path(os.environ["ARCANUM_HOME"])
          assert (home / "arcanum.db").is_file(), "arcanum.db was not created"
          assert (home / "arcanum-tabs.sqlite").is_file(), "tab registry was not created"
          print("migration smoke check OK")
          PY
          else
            echo "::notice::migration helper not present; skipping migration test"
          fi

      - name: Shared-room consistency test
        shell: bash
        run: python -m pytest tests/integration/test_domain_rooms.py -q

      - name: Execution verification test
        shell: bash
        run: python -m pytest tests/integration/test_completion_verification.py -q
