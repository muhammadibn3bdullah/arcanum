[project]
name = "arcanum"
version = "0.1.0"
description = "Arcanum — autonomous multi-agent security automation with Maestro, OpenCode, canonical shared rooms, and deterministic verification"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
discord = ["discord.py>=2.4"]
mcp = ["mcp>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
